    function TimezoneClock() {
      const [now, setNow] = useState(new Date());
      useEffect(() => {
        const id = setInterval(() => setNow(new Date()), 1000);
        return () => clearInterval(id);
      }, []);

      const fmt = (date, tz) => {
        const timeStr = date.toLocaleTimeString("zh-TW", { timeZone:tz, hour:"2-digit", minute:"2-digit", second:"2-digit", hour12:false });
        const dateStr = date.toLocaleDateString("zh-TW", { timeZone:tz, month:"2-digit", day:"2-digit", weekday:"short" });
        return { time:timeStr, date:dateStr };
      };

      return (
        <div style={{ padding:"0 16px 2px" }}>
          <div style={{ background:"rgba(255,255,255,0.03)", border:"1px solid rgba(255,255,255,0.09)", borderRadius:18, padding:"14px 4px 10px", marginBottom:12 }}>
            <div style={{ fontSize:10, color:"#64748b", letterSpacing:4, textAlign:"center", marginBottom:10 }}>🌍 即時時區對照</div>
            <div style={{ display:"flex", gap:6, padding:"0 10px" }}>
              {TZ_ZONES.map(z => {
                const { time, date } = fmt(now, z.tz);
                return (
                  <div key={z.label} style={{ flex:1, background:z.bg, border:`1px solid ${z.accent}30`, borderRadius:13, padding:"10px 6px", textAlign:"center" }}>
                    <div style={{ fontSize:16, marginBottom:2 }}>{z.flag}</div>
                    <div style={{ fontSize:10, color:z.accent, fontWeight:700, marginBottom:4 }}>{z.label}</div>
                    <div style={{ fontSize:18, fontWeight:900, color:"#f0f0f0", fontVariantNumeric:"tabular-nums", letterSpacing:-0.5 }}>{time.slice(0,5)}</div>
                    <div style={{ fontSize:9, color:"#64748b", marginTop:2, fontVariantNumeric:"tabular-nums" }}>{time.slice(6)}<span style={{ opacity:0.5 }}>秒</span></div>
                    <div style={{ fontSize:9.5, color:"#94a3b8", marginTop:3 }}>{date}</div>
                  </div>
                );
              })}
            </div>
            <div style={{ textAlign:"center", marginTop:8, fontSize:10, color:"#475569" }}>
              台灣比曼谷快 1 小時
            </div>
          </div>
        </div>
      );
    }

    function useCountdown() {
      const [diff, setDiff] = useState(TRIP_START - Date.now());
      useEffect(() => { const id = setInterval(() => setDiff(TRIP_START - Date.now()), 1000); return () => clearInterval(id); }, []);
      if (diff <= 0) return null;
      return { d:Math.floor(diff/86400000), h:Math.floor((diff%86400000)/3600000), m:Math.floor((diff%3600000)/60000), s:Math.floor((diff%60000)/1000) };
    }

    function getTodayDay() {
      const now = new Date();
      for (let i = 0; i < DAYS.length; i++) {
        const d = DAYS[i];
        const [m, day] = d.date.split("/").map(Number);
        const tripDate = new Date(2026, m - 1, day);
        if (now.toDateString() === tripDate.toDateString()) return i;
      }
      return null;
    }

    const openMap = q => {
      const encoded = encodeURIComponent(q);
      const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
      const isAndroid = /Android/i.test(navigator.userAgent);
      const webUrl = `https://www.google.com/maps/search/?api=1&query=${encoded}`;
      if (isIOS) {
        const appUrl = `comgooglemaps://?q=${encoded}`;
        const start = Date.now();
        window.location.href = appUrl;
        setTimeout(() => { if (Date.now() - start < 1500) window.open(webUrl, "_blank"); }, 800);
      } else if (isAndroid) {
        const intentUrl = `intent://maps.google.com/maps?q=${encoded}#Intent;scheme=https;package=com.google.android.apps.maps;end`;
        const opened = window.open(intentUrl, "_blank");
        if (!opened) {
          // 若 intent 無法開啟，改用 geo: URI，不再 setTimeout 開網頁
          window.location.href = `geo:0,0?q=${encoded}`;
        }
      } else {
        window.open(webUrl, "_blank");
      }
    };

    // PHRASEBOOK  (with TTS — Thai th-TH, fallback to any th voice)
    // ═══════════════════════════════════════════════════════════════
    function Phrasebook() {
      const [selCat, setSelCat] = useState(0);
      const [flipped, setFlipped] = useState({});
      const [speaking, setSpeaking] = useState(null);
      const audioRef = useRef(null);
      const ttsOk = true;
      const thVoice = true;

      useEffect(() => { return () => {
        if(audioRef.current){ audioRef.current.pause(); audioRef.current = null; }
      }; }, []);

      function speak(e, text, key) {
        e.stopPropagation();
        if (audioRef.current) { audioRef.current.pause(); audioRef.current = null; }
        if (speaking === key) { setSpeaking(null); return; }

        setSpeaking(key);

        if (window.speechSynthesis) {
          const doSpeak = () => {
            const voices = window.speechSynthesis.getVoices();
            const thVoice = voices.find(v => v.lang && v.lang.startsWith("th"));
            if (thVoice) {
              const utter = new SpeechSynthesisUtterance(text);
              utter.lang = "th-TH";
              utter.voice = thVoice;
              utter.rate = 0.85;
              utter.onend = () => setSpeaking(null);
              utter.onerror = () => { window.speechSynthesis.cancel(); fallbackTTS(text, key); };
              window.speechSynthesis.cancel();
              window.speechSynthesis.speak(utter);
            } else {
              fallbackTTS(text, key);
            }
          };
          const voices = window.speechSynthesis.getVoices();
          if (voices.length > 0) {
            doSpeak();
          } else {
            window.speechSynthesis.onvoiceschanged = () => {
              window.speechSynthesis.onvoiceschanged = null;
              doSpeak();
            };
            setTimeout(() => {
              window.speechSynthesis.onvoiceschanged = null;
              if (!audioRef.current) fallbackTTS(text, key);
            }, 1500);
          }
        } else {
          fallbackTTS(text, key);
        }
      }

      function fallbackTTS(text, key) {
        const url = "https://translate.google.com/translate_tts?ie=UTF-8&q="
          + encodeURIComponent(text) + "&tl=th&client=tw-ob";
        const audio = new Audio(url);
        audioRef.current = audio;
        audio.onended = () => { audioRef.current = null; setSpeaking(null); };
        audio.onerror = () => { audioRef.current = null; setSpeaking(null); };
        audio.play().catch(() => { audioRef.current = null; setSpeaking(null); });
      }

      return (
        <div style={{ padding:"16px" }}>
          <div style={{ fontSize:18, fontWeight:800, marginBottom:4, paddingTop:4 }}>🗣️ 泰語速成卡</div>
          <div style={{ fontSize:12, color:"#64748b", marginBottom:6 }}>
            點卡片翻面・按 🔊 聽泰語發音
          </div>

          {/* voice status banner */}
          <div style={{ fontSize:11, color:"#4ade80", background:"rgba(74,222,128,0.07)", border:"1px solid rgba(74,222,128,0.2)", borderRadius:10, padding:"6px 10px", marginBottom:10 }}>
            🔊 按喇叭圖示即可聽泰語發音
          </div>

          {/* category tabs */}
          <div style={{ display:"flex", gap:6, overflowX:"auto", paddingBottom:8, marginBottom:14, scrollbarWidth:"none" }}>
            {PHRASES.map((p,i) => (
              <button key={i} onClick={() => { setSelCat(i); setFlipped({}); window.speechSynthesis&&window.speechSynthesis.cancel(); setSpeaking(null); }} style={{
                flexShrink:0, background:selCat===i?"rgba(249,115,22,0.25)":"rgba(255,255,255,0.05)",
                border:`1px solid ${selCat===i?"rgba(249,115,22,0.5)":"rgba(255,255,255,0.1)"}`,
                borderRadius:20, padding:"5px 12px", fontSize:11,
                color:selCat===i?"#f97316":"#64748b", cursor:"pointer", fontWeight:selCat===i?700:400,
              }}>{p.cat}</button>
            ))}
          </div>

          {/* cards */}
          <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
            {PHRASES[selCat].items.map((item, i) => {
              const isFlipped = !!flipped[i];
              const key = `${selCat}-${i}`;
              const isSpeaking = speaking === key;
              return (
                <div key={i} onClick={() => setFlipped(p => ({...p, [i]:!p[i]}))} style={{
                  textAlign:"left", cursor:"pointer",
                  background:isFlipped?"rgba(249,115,22,0.12)":"rgba(255,255,255,0.04)",
                  border:`1px solid ${isSpeaking?"rgba(251,191,36,0.7)":isFlipped?"rgba(249,115,22,0.35)":"rgba(255,255,255,0.08)"}`,
                  borderRadius:16, padding:"14px 16px", transition:"all 0.2s",
                  boxShadow:isSpeaking?"0 0 14px rgba(251,191,36,0.22)":"none",
                }}>
                  <div style={{ display:"flex", alignItems:"flex-start", justifyContent:"space-between", gap:10 }}>
                    <div style={{ flex:1, minWidth:0 }}>
                      {!isFlipped ? (
                        <div>
                          <div style={{ fontSize:18, fontWeight:800, color:"#f0f0f0", marginBottom:4 }}>{item.th}</div>
                          <div style={{ fontSize:11, color:"#64748b" }}>點擊翻面看翻譯 →</div>
                        </div>
                      ) : (
                        <div>
                          <div style={{ fontSize:15, fontWeight:700, color:"#f97316", marginBottom:5 }}>{item.th}</div>
                          <div style={{ fontSize:12, color:"#fbbf24", marginBottom:5, fontStyle:"italic" }}>/{item.ph}/</div>
                          <div style={{ fontSize:14, color:"#e2e8f0", fontWeight:600 }}>🇹🇼 {item.zh}</div>
                        </div>
                      )}
                    </div>

                    {/* TTS button — always visible */}
                    {ttsOk && (
                      <button
                        onClick={e => speak(e, item.th, key)}
                        style={{
                          flexShrink:0, width:42, height:42, borderRadius:12,
                          background:isSpeaking?"rgba(251,191,36,0.25)":"rgba(255,255,255,0.07)",
                          border:`1.5px solid ${isSpeaking?"rgba(251,191,36,0.7)":"rgba(255,255,255,0.15)"}`,
                          color:isSpeaking?"#fbbf24":"#94a3b8",
                          cursor:"pointer", fontSize:19,
                          display:"flex", alignItems:"center", justifyContent:"center",
                          animation:isSpeaking?"thPulse 0.8s ease-in-out infinite":"none",
                          transition:"all 0.2s",
                        }}
                        title="播放泰語發音"
                      >
                        {isSpeaking ? "🔊" : "🔈"}
                      </button>
                    )}
                  </div>
                </div>
              );
            })}
          </div>

          <div style={{ textAlign:"center", marginTop:16, fontSize:12, color:"#475569" }}>
            共 {PHRASES[selCat].items.length} 個常用句子 · 按 🔈 聽泰語發音
          </div>

          <div style={{ background:"rgba(249,115,22,0.07)", border:"1px solid rgba(249,115,22,0.2)", borderRadius:13, padding:13, marginTop:14 }}>
            <div style={{ fontSize:11, color:"#f97316", marginBottom:6 }}>💡 泰語小撇步</div>
            <div style={{ fontSize:12, color:"#fed7aa", lineHeight:1.75 }}>{"• 男性句尾加「ครับ (khrap)」，女性加「ค่ะ (kha)」表示禮貌\n• 泰語有五個聲調，多聽多跟著唸\n• 搭計程車一定要問「By meter?」（ขึ้นมิเตอร์ไหม）\n• 微笑是最好的溝通工具 😊"}</div>
          </div>
          <style>{`@keyframes thPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}`}</style>
        </div>
      );
    }

    const MOODS = ["😄","😊","😐","😴","🤩","😋","🥵","🌧️","✨","🇹🇭"];

    function TravelDiary() {
      const [entries, setEntries] = useState(() => {
        try { const s = localStorage.getItem("encore_bkk_diary"); return s ? JSON.parse(s) : {}; } catch(e) { return {}; }
      });
      const [editing, setEditing] = useState(null);
      const [draft, setDraft] = useState({ mood:"😊", note:"", highlight:"" });

      function openEdit(dateIdx) {
        const key = DAYS[dateIdx].date;
        setDraft(entries[key] || { mood:"😊", note:"", highlight:"" });
        setEditing(dateIdx);
      }

      function save() {
        const key = DAYS[editing].date;
        const newEntries = { ...entries, [key]: draft };
        setEntries(newEntries);
        try { localStorage.setItem("encore_bkk_diary", JSON.stringify(newEntries)); } catch(e) {}
        setEditing(null);
      }

      if (editing !== null) {
        const day = DAYS[editing];
        const t = gt(day.city);
        return (
          <div style={{ padding:"16px" }}>
            <button onClick={() => setEditing(null)} style={{ background:"rgba(255,255,255,0.07)", border:"1px solid rgba(255,255,255,0.13)", borderRadius:10, padding:"8px 14px", color:"#94a3b8", cursor:"pointer", fontSize:13, marginBottom:14 }}>‹ 返回日記</button>
            <div style={{ background:`linear-gradient(135deg,${t.grad[0]},${t.grad[1]})`, border:`1px solid ${t.accent}40`, borderRadius:18, padding:"16px 18px", marginBottom:14 }}>
              <span style={{ fontSize:28 }}>{day.emoji}</span>
              <div style={{ fontSize:11, color:t.accent, marginTop:6, letterSpacing:2 }}>{day.date} {day.day}</div>
              <div style={{ fontSize:16, fontWeight:800, marginTop:2 }}>{day.title}</div>
            </div>
            <div style={{ marginBottom:14 }}>
              <div style={{ fontSize:12, color:"#94a3b8", marginBottom:8 }}>今天的心情</div>
              <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
                {MOODS.map(m => (

      return (
        <div style={{ padding:"16px" }}>
          <div style={{ fontSize:18, fontWeight:800, marginBottom:4, paddingTop:4 }}>📓 旅遊日記</div>

            return (
              <button key={i} onClick={() => openEdit(i)} style={{
                width:"100%", textAlign:"left", cursor:"pointer",
                background:`linear-gradient(135deg,${t.grad[0]}cc,${t.grad[1]}66)`,
                border:`1px solid ${entry?"rgba(249,115,22,0.4)":t.accent+"22"}`,

                <div style={{ flex:1, minWidth:0 }}>
                  <div style={{ fontSize:11, color:t.accent, fontWeight:700, marginBottom:2 }}>{day.date} {day.day} · {day.city}</div>

                {entry ? (
                  <div style={{ background:"rgba(249,115,22,0.2)", border:"1px solid rgba(249,115,22,0.35)", borderRadius:8, padding:"3px 8px", fontSize:10, color:"#f97316", flexShrink:0 }}>已記錄</div>

          <div style={{ textAlign:"center", marginTop:8, fontSize:12, color:"#475569" }}>
            已記錄 {Object.keys(entries).length}/{DAYS.length} 天
          </div>
        </div>
      );
    }

              <div style={{ padding:16 }}>
                <button onClick={()=>setSelDay(null)} style={{ background:"rgba(255,255,255,0.07)", border:"1px solid rgba(255,255,255,0.13)", borderRadius:10, padding:"8px 14px", color:"#94a3b8", cursor:"pointer", fontSize:13, marginBottom:14 }}>‹ 返回行程</button>
                <div style={{ background:`linear-gradient(135deg,${t.grad[0]},${t.grad[1]})`, border:`1px solid ${t.accent}40`, borderRadius:20, padding:"18px 18px 14px", marginBottom:14 }}>
                  <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start" }}>
                    <div>
                      <div style={{ fontSize:11, color:t.accent, letterSpacing:2, marginBottom:4 }}>{day.date} {day.day}</div>
                      <div style={{ fontSize:22, fontWeight:900, lineHeight:1.2, marginBottom:6 }}>{day.emoji} {day.title}</div>
                      <div style={{ fontSize:12, color:"#94a3b8" }}>{day.weather}</div>
                    </div>
                    <button onClick={()=>openMap(day.mapQuery)} style={{ background:`${t.accent}18`, border:`1px solid ${t.accent}40`, borderRadius:12, padding:"8px 10px", color:t.accent, cursor:"pointer", fontSize:12, textAlign:"center", flexShrink:0 }}>📍<br/><span style={{ fontSize:10 }}>地圖</span></button>
                  </div>
                  {day.highlights.length>0 && (
                    <div style={{ display:"flex", gap:5, flexWrap:"wrap", marginTop:10 }}>
                      {day.highlights.map((h,i)=><span key={i} style={{ fontSize:10, color:t.accent, background:`${t.accent}18`, border:`1px solid ${t.accent}30`, borderRadius:8, padding:"2px 9px" }}>{h}</span>)}
                    </div>
                  )}
                </div>

                {day.budget&&day.budget.length>0 && (
                  <Card accent="#fbbf24" style={{ marginBottom:10 }}>
                    <SecLabel color="#fbbf24">💰 預估費用</SecLabel>
                    {day.budget.map((b,i)=>(
                      <div key={i} style={{ display:"flex", justifyContent:"space-between", fontSize:12, color:"#e2e8f0", marginBottom:5, paddingBottom:5, borderBottom:i<day.budget.length-1?"1px solid rgba(251,191,36,0.1)":"none" }}>
                        <span style={{ color:"#94a3b8" }}>{b.item}</span>
                        <span style={{ color:"#fbbf24", fontWeight:700 }}>{b.cost}</span>
                      </div>
                    ))}
                  </Card>
                )}

                <Card accent={t.accent} style={{ marginBottom:10 }}>
                  <SecLabel color={t.accent}>🕐 今日行程</SecLabel>
                  {day.schedule.map((s,i)=>(
                    <div key={i} style={{ display:"flex", gap:10, marginBottom:i<day.schedule.length-1?12:0 }}>
                      <div style={{ fontSize:10, color:t.accent, fontWeight:700, minWidth:44, paddingTop:3, flexShrink:0 }}>{s.time}</div>
                      <div style={{ display:"flex", flexDirection:"column", alignItems:"center", flexShrink:0 }}>
                        <div style={{ width:28, height:28, borderRadius:"50%", background:`${t.accent}1a`, border:`1.5px solid ${t.accent}48`, display:"flex", alignItems:"center", justifyContent:"center", fontSize:14 }}>{s.icon}</div>
                        {i<day.schedule.length-1 && <div style={{ width:1.5, flex:1, minHeight:12, background:`${t.accent}1a`, marginTop:2 }} />}
                      </div>
                      <div style={{ fontSize:12.5, color:"#cbd5e1", lineHeight:1.7, flex:1, paddingTop:3, whiteSpace:"pre-line" }}>{s.content}</div>
                    </div>
                  ))}
                </Card>

                {day.tickets&&day.tickets.length>0 && (
                  <Card accent="#f97316" style={{ marginBottom:10 }}>
                    <SecLabel color="#f97316">🎫 重要資訊</SecLabel>
                    {day.tickets.map((tk,i)=>{
                      const label = typeof tk === "string" ? tk : tk.label;
                      const url = typeof tk === "object" ? tk.url : null;
                      if (url) {
                        return (
                          <button key={i} onClick={()=>{ window.location.href=url; }} style={{ display:"flex", alignItems:"center", justifyContent:"space-between", width:"100%", textAlign:"left", fontSize:12, color:"#fed7aa", marginBottom:6, padding:"8px 10px", background:"rgba(249,115,22,0.12)", border:"1px solid rgba(249,115,22,0.35)", borderRadius:10, cursor:"pointer" }}>
                            <span style={{ flex:1, lineHeight:1.5 }}>{label}</span>
                            <span style={{ fontSize:11, color:"#f97316", marginLeft:8, flexShrink:0 }}>開啟 →</span>
                          </button>
                        );
                      }
                      return (
                        <div key={i} style={{ fontSize:12, color:"#fed7aa", marginBottom:4, paddingLeft:9, borderLeft:"2px solid rgba(249,115,22,0.38)", lineHeight:1.5, padding:"4px 0 4px 9px" }}>{label}</div>
                      );
                    })}
                  </Card>
                )}

                {day.tips && (
                  <div style={{ background:"rgba(251,191,36,0.07)", border:"1px solid rgba(251,191,36,0.23)", borderRadius:13, padding:13, marginBottom:12 }}>
                    <div style={{ fontSize:11, color:"#fbbf24", marginBottom:5 }}>💡 小提醒</div>
                    <div style={{ fontSize:12.5, color:"#fde68a", lineHeight:1.75, whiteSpace:"pre-line" }}>{day.tips}</div>
                  </div>
                )}
                <div style={{ display:"flex", gap:7 }}>
                  {selDay>0 && <button onClick={()=>setSelDay(selDay-1)} style={{ flex:1, padding:"9px", background:"rgba(255,255,255,0.05)", border:"1px solid rgba(255,255,255,0.09)", borderRadius:11, color:"#94a3b8", cursor:"pointer", fontSize:12 }}>‹ {DAYS[selDay-1].date} {DAYS[selDay-1].emoji}</button>}
                  {selDay<DAYS.length-1 && <button onClick={()=>setSelDay(selDay+1)} style={{ flex:1, padding:"9px", background:"rgba(255,255,255,0.05)", border:"1px solid rgba(255,255,255,0.09)", borderRadius:11, color:"#94a3b8", cursor:"pointer", fontSize:12, textAlign:"right" }}>{DAYS[selDay+1].date} {DAYS[selDay+1].emoji} ›</button>}
                </div>
              </div>
            );
          })()}

          {tab==="spots" && <CitySpots />}
          {tab==="phrase" && <Phrasebook />}
          {tab==="diary" && <TravelDiary />}

          {/* ══════ CHECKLIST ══════ */}
          {tab==="checklist" && (
            <div style={{ padding:16 }}>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:5, paddingTop:6 }}>
                <div style={{ fontSize:18, fontWeight:800 }}>☑️ 行前清單</div>
                <Pill color={pct===100?"#4ade80":"#fbbf24"} style={{ fontSize:12, fontWeight:700 }}>{pct}%</Pill>
              </div>
              <div style={{ background:"rgba(255,255,255,0.09)", borderRadius:10, height:5, overflow:"hidden", marginBottom:14 }}>
                <div style={{ height:"100%", borderRadius:10, transition:"width 0.3s", background:pct===100?"linear-gradient(90deg,#4ade80,#22d3ee)":"linear-gradient(90deg,#f97316,#fbbf24)", width:`${pct}%` }} />
              </div>
              {CHECKLIST.map((cat,ci) => {
                const catDone=cat.items.filter(it=>checked[`${cat.cat}|${it}`]).length;
                return (
                  <div key={ci} style={{ marginBottom:13 }}>
                    <div style={{ display:"flex", justifyContent:"space-between", marginBottom:5 }}>
                      <span style={{ fontSize:13, fontWeight:700, color:"#f97316" }}>{cat.cat}</span>
                      <span style={{ fontSize:11, color:"#64748b" }}>{catDone}/{cat.items.length}</span>
                    </div>
                    <div style={{ background:"rgba(255,255,255,0.04)", border:"1px solid rgba(255,255,255,0.07)", borderRadius:13, overflow:"hidden" }}>
                      {cat.items.map((item,ii)=>{
                        const done=!!checked[`${cat.cat}|${item}`];
                        return (
                          <button key={ii} onClick={()=>toggle(cat.cat,item)} style={{ display:"flex", alignItems:"center", gap:9, width:"100%", textAlign:"left", padding:"10px 13px", background:done?"rgba(74,222,128,0.08)":"none", border:"none", borderTop:ii>0?"1px solid rgba(255,255,255,0.05)":"none", cursor:"pointer" }}>
                            <div style={{ width:21, height:21, borderRadius:6, flexShrink:0, border:done?"none":"2px solid rgba(255,255,255,0.2)", background:done?"#4ade80":"transparent", display:"flex", alignItems:"center", justifyContent:"center" }}>
                              {done && <span style={{ fontSize:12, color:"#052e16", fontWeight:800 }}>✓</span>}
                            </div>
                            <span style={{ fontSize:13, color:done?"#86efac":"#e2e8f0", textDecoration:done?"line-through":"none", opacity:done?0.65:1, lineHeight:1.4 }}>{item}</span>
                          </button>
                        );
                      })}
                    </div>
                  </div>
                );
              })}
              {pct===100 && (
                <div style={{ textAlign:"center", padding:"20px 14px", background:"rgba(74,222,128,0.1)", border:"1px solid rgba(74,222,128,0.28)", borderRadius:16, marginTop:4 }}>
                  <div style={{ fontSize:34, marginBottom:6 }}>🎉</div>
                  <div style={{ fontSize:15, fontWeight:800, color:"#4ade80" }}>全部打包完成！</div>
                  <div style={{ fontSize:12, color:"#86efac", marginTop:4 }}>出發吧！曼谷等著你！🇹🇭</div>
                </div>
              )}
            </div>
          )}

          {/* ══════ BOTTOM NAV ══════ */}
          <div style={{ position:"fixed", bottom:0, left:"50%", transform:"translateX(-50%)", width:"100%", maxWidth:480, WebkitBackdropFilter:"blur(20px)", background:"rgba(7,5,18,0.97)", backdropFilter:"blur(20px)", borderTop:"1px solid rgba(255,255,255,0.07)", display:"flex" }}>
            {TABS.map(t=>(
              <button key={t.id} onClick={() => { setTab(t.id); if(t.id!=="itinerary") setSelDay(null); }}
                style={{ flex:1, padding:"9px 2px 7px", background:"none", border:"none", borderTop:tab===t.id?"2px solid #f97316":"2px solid transparent", color:tab===t.id?"#f97316":"#475569", cursor:"pointer", display:"flex", flexDirection:"column", alignItems:"center", gap:1, fontSize:"8.5px" }}>
                <span style={{ fontSize:17 }}>{t.icon}</span>
                {t.label}
              </button>
            ))}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
