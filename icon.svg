<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="100" fill="#1a0a2e"/>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2d1060"/>
      <stop offset="100%" stop-color="#0d0520"/>
    </radialGradient>
  </defs>
  <!-- Thai temple silhouette -->
  <g fill="#f97316" opacity="0.9">
    <!-- spire top -->
    <polygon points="256,60 268,130 244,130" />
    <polygon points="256,90 278,160 234,160" />
    <!-- main tower -->
    <rect x="224" y="155" width="64" height="80" rx="4"/>
    <!-- roof layers -->
    <polygon points="256,140 300,170 212,170" />
    <polygon points="256,120 310,158 202,158" />
    <!-- body -->
    <rect x="200" y="230" width="112" height="100" rx="6"/>
    <!-- door arch -->
    <rect x="238" y="260" width="40" height="70" rx="20"/>
    <!-- base platform -->
    <rect x="170" y="328" width="172" height="20" rx="4"/>
    <rect x="150" y="344" width="212" height="14" rx="4"/>
  </g>
  <!-- Stars -->
  <circle cx="140" cy="120" r="3" fill="#fbbf24" opacity="0.7"/>
  <circle cx="380" cy="90" r="2" fill="#fbbf24" opacity="0.5"/>
  <circle cx="100" cy="200" r="2" fill="#fbbf24" opacity="0.4"/>
  <circle cx="400" cy="180" r="3" fill="#fbbf24" opacity="0.6"/>
  <circle cx="160" cy="300" r="2" fill="#fbbf24" opacity="0.3"/>
  <!-- Thailand flag colors accent bar -->
  <rect x="60" y="420" width="392" height="8" rx="4" fill="#e53935" opacity="0.6"/>
  <rect x="60" y="432" width="392" height="8" rx="4" fill="#ffffff" opacity="0.4"/>
  <rect x="60" y="444" width="392" height="12" rx="4" fill="#1565c0" opacity="0.6"/>
  <!-- Text -->
  <text x="256" y="404" font-family="sans-serif" font-size="28" font-weight="bold" fill="#f97316" text-anchor="middle">ENcore+</text>
</svg>
